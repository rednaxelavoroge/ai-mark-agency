<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#2d381b" />
    <title>Offline · AI MARK Partner Platform</title>
    <style>
      :root { color-scheme: light; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #faf8f5;
        color: #161614;
        font-family: Manrope, ui-sans-serif, system-ui, sans-serif;
      }
      main {
        width: min(28rem, calc(100% - 2rem));
        padding: 1.5rem;
        border: 1px solid rgba(22, 22, 20, 0.08);
        border-radius: 1rem;
        background: #fff;
      }
      p { color: #6b675e; line-height: 1.5; }
      a {
        color: #161614;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <main>
      <p style="margin:0; font-size:0.7rem; letter-spacing:0.16em; text-transform:uppercase; color:#2d381b;">
        AI MARK
      </p>
      <h1 style="font-size:1.5rem; margin:0.75rem 0 0.5rem;">You are offline</h1>
      <p>
        The partner cabinet needs a connection. Nothing here is stored on this device.
        Reconnect, then open the cabinet again.
      </p>
      <p><a href="/partner/dashboard">Try again</a></p>
    </main>
  </body>
</html>
